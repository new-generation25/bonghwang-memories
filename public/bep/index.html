.flow .tot{font-weight:700;border-bottom:2px solid var(--navy);color:var(--navy)}

 const avgMult=(V("d1")*V("m1")+V("d2")*V("m2")+V("d3")*V("m3"))/w;
 const avgSpend=thr*avgMult;
 const baseProfit=thr*mgn-face;          // 문턱만 맞췄을 때
 const profit=avgSpend*mgn-face;         // 초과 지출 반영
 const covMax=face>0?Math.min(1,avgSpend*mgn/face):0;
 const thrNeed=mgn>0?face/(mgn*avgMult):0;
 const covRaw=face>0?avgSpend*mgn/face:0,mgnCrit=avgSpend>0?face/avgSpend:0;
 return{face,thr,mgn,avgMult,avgSpend,baseProfit,profit,covMax,thrNeed,covRaw,mgnCrit};}
